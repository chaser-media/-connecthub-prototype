  function pageLogin(){return `<div class="auth-wrap"><div class="card pad"><div class="auth-logo">C</div><span class="eyebrow">STEP 01 / ACCOUNT</span><h1 class="heading">Karibu ConnectHub 👋</h1><p class="lead">Anza kwa demo ya login/signup. Hakuna SMS halisi itakayotumwa.</p><form id="login-form"><div class="field"><label for="phone">Phone number (demo)</label><input class="input" id="phone" name="phone" type="tel" inputmode="tel" placeholder="07XX XXX XXX" autocomplete="off" required><span class="hint">Usitumie namba yako halisi; andika mfano 0712 345 678.</span></div><label class="check"><input type="checkbox" id="adult" required> <span>Ninathibitisha nina umri wa miaka 18 au zaidi na ninakubali kushiriki kwa heshima.</span></label><div style="height:18px"></div><button class="btn full" type="submit">Continue with demo OTP →</button><div id="login-error" class="form-error" aria-live="polite"></div></form><div class="line"></div><div class="callout">🔒 Demo hii haikuhifadhii taarifa kwenye server. Usitumie data binafsi halisi hapa.</div></div></div>`}

  function pageCreate(){return `<div class="steps"><span class="step done">✓ Phone demo</span><span class="step current">2 · Your profile</span><span class="step">3 · Verification</span><span class="step">4 · Discover</span></div><div class="two-col"><div class="card pad"><span class="eyebrow">YOUR SPACE</span><h1 class="heading">Create your profile</h1><p class="lead">Tengeneza profile ya mfano. Tumia jina la kubuni badala ya taarifa zako halisi.</p><form id="profile-form"><div class="form-half"><div class="field"><label for="pf-name">Name / Nickname</label><input class="input" id="pf-name" maxlength="35" placeholder="e.g. Alex" value="${esc(s.profile.name)}" required></div><div class="field"><label for="pf-age">Age (18+)</label><input class="input" id="pf-age" type="number" min="18" max="100" placeholder="25" value="${esc(s.profile.age)}" required></div></div><div class="form-half"><div class="field"><label for="pf-city">Location</label><select class="select" id="pf-city" required><option value="">Select city</option>${['Dar es Salaam','Arusha','Mwanza','Dodoma','Morogoro','Mbeya','Zanzibar','Other'].map(x=>`<option ${s.profile.city===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="pf-gender">Gender</label><select class="select" id="pf-gender" required><option value="">Select</option>${['Woman','Man','Non-binary','Prefer not to say'].map(x=>`<option ${s.profile.gender===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label for="pf-bio">Bio</label><textarea class="textarea" id="pf-bio" maxlength="300" placeholder="A few words about you...">${esc(s.profile.bio)}</textarea></div><div class="field"><label for="pf-interests">Interests</label><input class="input" id="pf-interests" maxlength="100" placeholder="Music, travel, books" value="${esc(s.profile.interests)}"><span class="hint">Separate interests with commas.</span></div><div class="callout">📷 Profile photo: placeholder in this demo. Photo   function pageVerification(){return `<div class="steps"><span class="step done">✓ Phone demo</span><span class="step done">✓ Profile</span><span class="step current">3 · Verification</span><span class="step">4 · Discover</span></div><div class="two-col"><div class="card pad"><span class="eyebrow">BUILD TRUST</span><h1 class="heading">Verification</h1><p class="lead">ConnectHub ni ya watu wazima waliothibitishwa. Hapa ni mfano wa flow ya selfie/photo verification, si uthibitishaji halisi.</p><div class="list-card"><span style="font-size:27px">📱</span><div class="list-main"><strong>Phone OTP (demo)</strong><p>${s.registered?'Demo code accepted':'Complete the phone demo first'}</p></div><span class="status ${s.registered?'':'pending'}">${s.registered?'Complete':'Pending'}</span></div><div class="list-card"><span style="font-size:27px">🤳</span><div class="list-main"><strong>Selfie / photo review (demo)</strong><p>No real photos or ID documents are uploaded.</p></div><span class="status ${s.verified?'':'pending'}">${s.verified?'Demo complete':'Pending'}</span></div><div class="line"></div><button class="btn" id="verify-demo" ${s.verified?'disabled':''}>${s.verified?'✓ Demo verified':'Simulate verification approval'}</button> <button class="btn ghost" data-go="home">Explore profiles →</button></div><div class="card pad"><div style="font-size:43px">🛡️</div><h2>Verified adults</h2><p class="lead">A production app would require real age assurance, secure verification, privacy controls, review procedures and an appeal process. A demo badge alone does not establish identity or age.</p><div class="callout warn">⚠️ Do not upload IDs, selfies or sensitive information to this demo.</div></div></div>`}

  function pageDiscover(){let filtered=people.filter(p=>!s.blocked.has(p.id)&&(!s.search||(p.name+' '+p.bio+' '+p.interests.join(' ')).toLowerCase().includes(s.search.toLowerCase()))&&(!s.city||p.city===s.city)&&(!s.gender||p.gender===s.gender)&&(!s.age||(s.age==='18-25'?p.age<=25:s.age==='26-30'?p.age>=26&&p.age<=30:p.age>=31)));return `<span class="eyebrow">EXPLORE CONNECTIONS</span><h1 class="heading">Discover your people ✨</h1><p class="lead">Search fictional sample profiles by interests, location and age.</p><form class="search-row" id="filters"><input class="input" id="search-text" placeholder="Search name, interests..." value="${esc(s.search)}" aria-label="Search profiles"><select class="select" id="search-city" aria-label="Filter by location"><option value="">All locations</option>${[...new Set(people.map(p=>p.city))].map(x=>`<option ${s.city===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select class="select" id="search-gender" aria-label="Filter by gender"><option value="">All genders</option>${['Woman','Man'].map(x=>`<option ${s.gender===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" id="search-age" aria-label="Filter by age"><option value="">All ages 18+</option>${['18-25','26-30','31+'].map(x=>`<option ${s.age===x?'selected':''}>${x}</option>`).join('')}</select></form><div class="section-head"><h2>${filtered.length} profiles found</h2><button class="small-link" id="clear-filters">Clear filters</button></div>${filtered.length?`<div class="profiles">${filtered.map(profileCard).join('')}</div>`:`<div class="empty"><div class="big">🔍</div><h3>No profiles found</h3>Try adjusting your filters. <br><br><button class="btn secondary" id="clear-filters">Clear filters</button></div>`}`}

  function pagePayment(){let p=plans.find(x=>x.id===s.selectedPlan)||plans[0];return `<div class="two-col"><div class="card pad"><span class="eyebrow">SIMULATED CHECKOUT</span><h1 class="heading">Choose payment method</h1><p class="lead">Hii ni preview ya payment flow, si malipo halisi. Hatuombi namba ya simu, PIN au card.</p><div class="stack">${['M-Pesa','Airtel Money','Mixx by Yas','HaloPesa'].map(x=>`<label class="list-card" style="cursor:pointer"><span style="font-size:23px">${x==='M-Pesa'?'📱':x==='Airtel Money'?'🔴':x==='Mixx by Yas'?'🟡':'💠'}</span><div class="list-main"><strong>${x}</strong><p>Simulated mobile money method</p></div><input type="radio" name="payment-method" value="${x}" ${s.selectedPayment===x?'checked':''} aria-label="${x}"></label>`).join('')}</div><div class="line"></div><button class="btn full" id="simulate-payment">Simulate successful payment →</button><p class="hint">No real transaction occurs. Do not enter wallet details or PINs.</p></div><div class="card pad"><span class="eyebrow">ORDER SUMMARY</span><h2>${p.name}</h2><div class="list-card"><div class="list-main"><strong>${p.qty} Connection Credit${p.qty>1?'s':''}</strong><p>For unlocking demo conversations</p></div><strong>TZS ${fmt(p.price)}</strong></div><div class="line"></div><div class="btn-row" style="justify-content:space-between"><strong>Total</strong><strong>TZS ${fmt(p.price)}</strong></div><div class="line"></div><div class="callout warn">DEMO ONLY · No charges, wallet transfer or receipt is created.</div><p><button class="small-link" data-go="credits">← Change plan</button></p></div></div>`}
  function pageUnlock(){let p=current();let unlocked=s.unlocked.has(p.id);return `<div class="two-col"><div class="card pad"><span class="eyebrow">MAKE A CONNECTION</span><h1 class="heading">${unlocked?'Conversation unlocked!':'Unlock conversation'} 💬</h1><p class="lead">${unlocked?'You already have access to this demo chat.':`Use 1 credit to unlock a conversation with ${esc(p.name)}.`}</p><div class="list-card"><span class="list-avatar" style="background:linear-gradient(125deg,${p.a},${p.b})">${p.initials}</span><div class="list-main"><strong>${esc(p.name)}, ${p.age}</strong><p>${esc(p.city)} · ${p.verified?'Verified demo profile':'Demo profile'}</p></div>${p.verified?verified():''}</div><div class="line"></div><div class="list-card"><div class="list-main"><strong>Required</strong><p>One-time demo unlock</p></div><strong>1 ◆</strong></div><div class="list-card"><div class="list-main"><strong>Your balance</strong><p>Available demo credits</p></div><strong>${s.balance} ◆</strong></div><div style="height:20px"></div>${unlocked?'<button class="btn full" data-go="chat">Open chat →</button>':s.balance>=1?'<button class="btn full" id="confirm-unlock">Use 1 credit & unlock →</button>':'<button class="btn full" data-go="credits">Get demo credits →</button>'}<p class="hint">Unlocking grants access to the messaging feature, not to a person or any service.</p></div><div class="card pad"><div style="font-size:42px">💜</div><h2>Start with respect</h2><p class="lead">Introduce yourself, ask a question about shared interests and respect a no. You can block or report any profile.</p><button class="btn ghost" data-go="profile">← Back to profile</button></div></div>`}
  function pageChat(){let open=people.filter(p=>s.unlocked.has(p.id)&&!s.blocked.has(p.id));if(!open.length)return `<span class="eyebrow">MESSAGES</span><h1 class="heading">Your conversations</h1><div class="empty"><div class="big">💬</div><h3>No conversations unlocked yet</h3><p>Explore profiles and use a demo credit to unlock a conversation.</p><button class="btn" data-go="discover">Discover profiles →</button></div>`;if(!open.find(p=>p.id===s.selected))s.selected=open[0].id;let p=current(),msgs=s.messages[p.id]||[];return `<span class="eyebrow">MESSAGES</span><h1 class="heading">Your conversations</h1><div class="card chat-shell"><aside class="chat-list"><h3>Chats (${open.length})</h3>${open.map(person=>`<button class="chat-person" style="${person.id!==p.id?'background:white':''}" data-chat-person="${person.id}"><span class="list-avatar" style="background:linear-gradient(135deg,${person.a},${person.b});width:37px;height:37px;font-size:12px">${person.initials}</span><span class="list-main"><strong>${esc(person.name)}</strong><p>${person.id===p.id?'Current conversation':'Tap to open'}</p></span></button>`).join('')}</aside><div class="chat-pane"><div class="chat-head"><span class="list-avatar" style="background:linear-gradient(135deg,${p.a},${p.b});width:34px;height:34px;font-size:12px">${p.initials}</span>${esc(p.name)} ${p.verified?verified():''}<button class="small-link" data-go="report" style="margin-left:auto">Report</button></div><div class="chat-messages" id="message-scroll"><div class="bubble other">👋 Hi! Welcome to our demo chat. Start a respectful conversation with ${esc(p.name)}.</div>${msgs.map(m=>`<div class="bubble me">${esc(m)}</div>`).join('')}</div><form class="chat-compose" id="chat-form"><input class="input" id="chat-input" aria-label="Type a demo message" maxlength="500" placeholder="Write a message..." required><button class="btn" type="submit" aria-label="Send demo message">${ico('send',17)}</button></form></div></div><p class="hint">Demo messages are displayed only in this browser session; no message is delivered to a real person.</p>`}
  function pageConnections(){let open=people.filter(p=>s.unlocked.has(p.id)&&!s.blocked.has(p.id));return `<span class="eyebrow">STAY CONNECTED</span><h1 class="heading">Your connections</h1><p class="lead">Profiles whose conversations you've unlocked in this demo.</p>${open.length?`<div class="stack">${open.map(p=>`<div class="list-card"><span class="list-avatar" style="background:linear-gradient(135deg,${p.a},${p.b})">${p.initials}</span><div class="list-main"><strong>${esc(p.name)}, ${p.age} ${p.verified?'✓':''}</strong><p>${esc(p.city)} · Conversation unlocked</p></div><button class="btn sm" data-chat-person="${p.id}">Chat →</button></div>`).join('')}</div>`:`<div class="empty"><div class="big">🤝</div><h3>Your connections will appear here</h3><p>Unlock a demo conversation to see it here.</p><button class="btn" data-go="discover">Explore profiles →</button></div>`}`}
  function pageMycredits(){return `<div class="balance"><div><span class="eyebrow" style="color:#c7baff">DEMO WALLET</span><p>Available connection credits</p><strong>${s.balance} ◆</strong><p>One credit unlocks one conversation.</p></div><button class="btn" data-go="credits">Get credits →</button></div><div class="section-head"><h2>Activity</h2></div>${s.transactions.length?`<div class="card pad">${s.transactions.map(t=>`<div class="list-card"><div class="list-main"><strong>${esc(t.label)}</strong><p>${esc(t.detail)} · Demo transaction</p></div><strong style="color:${t.delta>0?'#238c71':'#bd5d79'}">${t.delta>0?'+':''}${t.delta} ◆</strong></div>`).join('')}</div>`:`<div class="empty"><div class="big">◆</div><h3>No demo activity yet</h3><p>Choose a credit plan to try a simulated purchase.</p><button class="btn" data-go="credits">View plans →</button></div>`}<p class="hint">Balances and activity reset on page refresh. No real wallet or money is involved.</p>`}
  function pageSettings(){return `<span class="eyebrow">YOUR EXPERIENCE</span><h1 class="heading">Settings</h1><div class="two-col"><div class="card pad"><h2>Account & privacy</h2><div class="toggle-row"><div><strong>Notifications</strong><p>Show demo notifications.</p></div><button class="switch ${s.notification?'on':''}" id="toggle-notifications" role="switch" aria-checked="${s.notification}" aria-label="Toggle notifications"></button></div><div class="toggle-row"><div><strong>Activity status</strong><p>Preview availability on your profile.</p></div><button class="switch ${s.activity?'on':''}" id="toggle-activity" role="switch" aria-checked="${s.activity}" aria-label="Toggle activity status"></button></div><div class="toggle-row"><div><strong>Manage profile</strong><p>Edit your demo nickname and interests.</p></div><button class="btn secondary sm" data-go="create">Edit →</button></div><div class="toggle-row"><div><strong>Verification</strong><p>${s.verified?'Simulated verified':'Not completed'}</p></div><button class="btn secondary sm" data-go="verification">View →</button></div><div class="line"></div><button class="btn secondary" id="logout-demo">Log out (demo) →</button><p class="hint">Return to login. Demo credits and messages remain only while this tab stays open; refreshing clears them.</p><button class="btn danger" id="reset-demo">Reset demo session</button></div><div class="stack"><div class="card pad"><h3>Community rules</h3><p class="hint">18+ only. Respect consent, privacy and boundaries. Harassment, impersonation and sexual-service listings are not allowed.</p><button class="btn ghost sm" data-go="report">Report / Block →</button></div><div class="card pad"><h3>Prototype information</h3><p class="hint">All sample profiles are fictional. No real phone OTP, identity verification, payment or chat service is connected.</p><span class="demo-pill">DEMO ENVIRONMENT</span></div><div class="card pad"><h3>Admin preview</h3><p class="hint">See how moderation could look. Demo only; no private user information is available.</p><button class="btn ghost sm" data-go="admin">Admin dashboard →</button></div></div></div>`}
  function pageReport(){let p=current();return `<div class="two-col"><div class="card pad"><span class="eyebrow">SAFETY FIRST</span><h1 class="heading">Report or block</h1><p class="lead">You can take control of who can contact you. This demo does not submit a report to a real moderation team.</p><div class="list-card"><span class="list-avatar" style="background:linear-gradient(135deg,${p.a},${p.b})">${p.initials}</span><div class="list-main"><strong>${esc(p.name)}</strong><p>Profile selected for this demo</p></div></div><div class="line"></div><form id="report-form"><div class="field"><label for="report-reason">Why are you reporting?</label><select class="select" id="report-reason" required><option value="">Select a reason</option><option>Harassment or bullying</option><option>Fake or misleading profile</option><option>Underage concern</option><option>Inappropriate content</option><option>Spam or scam</option><option>Other</option></select></div><div class="field"><label for="report-details">Details (optional)</label><textarea class="textarea" id="report-details" maxlength="400" placeholder="Describe the issue without entering sensitive information..."></textarea></div><div class="btn-row"><button class="btn" type="submit">Submit demo report</button><button class="btn danger" type="button" id="block-person">${s.blocked.has(p.id)?'Unblock profile':'Block profile'}</button></div></form><p class="hint">For immediate danger, contact local emergency services. Demo reports are not monitored.</p></div><div class="card pad"><div style="font-size:42px">🛡️</div><h2>You're in control</h2><p class="lead">Blocking hides this profile from your Discover list and removes access to its demo chat until you unblock it.</p><div class="callout warn">A live product needs an actual reporting queue, safety escalation and trained moderators.</div></div></div>`}
  function pageNotifications(){return `<span class="eyebrow">STAY IN THE LOOP</span><h1 class="heading">Notifications</h1><p class="lead">Examples of messages your future app could send.</p>${s.notification?`<div class="stack"><div class="list-card"><span class="stat-icon" style="margin:0">✨</span><div class="list-main"><strong>Welcome to ConnectHub!</strong><p>Discover people who share your interests.</p></div><span class="alert-count">1</span></div><div class="list-card"><span class="stat-icon" style="margin:0">🛡️</span><div class="list-main"><strong>Make safe connections</strong><p>Never share sensitive details or send money to strangers.</p></div><span class="alert-count">1</span></div></div>`:`<div class="empty"><h3>Notifications are turned off</h3><button class="btn" data-go="settings">Open settings →</button></div>`}`}
  function pageAdmin(){let rows=people.map(p=>`<tr><td><strong>${esc(p.name)}</strong><br><span class="mini">Sample profile #${p.id}</span></td><td>${esc(p.city)}</td><td><span class="status ${s.blocked.has(p.id)?'blocked':p.verified?'':'pending'}">${s.blocked.has(p.id)?'Blocked':p.verified?'Verified demo':'Review demo'}</span></td><td><button class="btn ghost sm" data-admin-profile="${p.id}">Review →</button></td></tr>`).join('');return `<span class="eyebrow">ADMIN PREVIEW · NOT SECURED</span><h1 class="heading">Admin dashboard</h1><p class="lead">A mock view of user, verification, payment and report management. This is not a real admin system and is intentionally accessible for demonstration.</p><div class="admin-grid"><div class="card admin-metric"><span>Sample profiles</span><strong>${people.length}</strong><span>Fictional data</span></div><div class="card admin-metric"><span>Verification reviews</span><strong>1</strong><span>Example pending item</span></div><div class="card admin-metric"><span>Demo purchases</span><strong>${s.transactions.filter(t=>t.delta>0).length}</strong><span>Simulated only</span></div><div class="card admin-metric"><span>Demo reports</span><strong id="report-count">0</strong><span>Session preview</span></div></div><div class="section-head"><h2>Moderation queue</h2></div><div class="card table-wrap"><table class="table"><thead><tr><th>Sample user</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows}</tbody></table></div><div class="line"></div><div class="card pad"><h3>Future production modules</h3><div class="tags"><span class="tag">Age and identity review</span><span class="tag">Payment reconciliation</span><span class="tag">Reports and appeals</span><span class="tag">Ban management</span><span class="tag">Audit logs</span></div><p class="hint">Admin access, permission checks, secure storage and audit logging must be built on a backend before launch.</p></div>`}
  const renderers={splash:pageSplash,login:pageLogin,otp:pageOtp,create:pageCreate,verification:pageVerification,home:pageHome,discover:pageDiscover,profile:pageProfile,credits:pageCredits,payment:pagePayment,unlock:pageUnlock,chat:pageChat,connections:pageConnections,mycredits:pageMycredits,settings:pageSettings,report:pageReport,admin:pageAdmin,notifications:pageNotifications};
  function render(scroll=true){let p=s.page;content.innerHTML=(renderers[p]||pageHome)()+`<div class="footer-note">ConnectHub · Interactive prototype · Fictional profiles · No real accounts, verification, payments or messaging · 18+</div>`;document.getElementById('page-title').textContent=titles[p]||'ConnectHub';document.getElementById('header-balance').textContent=s.balance;document.getElementById('chat-badge').textContent=s.unlocked.size;document.querySelectorAll('[data-icon]').forEach(el=>{let i=ico(el.dataset.icon);if(el.classList.contains('icon-btn'))el.innerHTML=i;else if(!el.dataset.decorated){el.insertAdjacentHTML('afterbegin',i);el.dataset.decorated='1'}});document.querySelectorAll('[data-go]').forEach(el=>{el.classList.toggle('active',el.dataset.go===p)});if(p==='admin')document.getElementById('report-count').textContent=s.reportCount||0;if(scroll)window.scrollTo({top:0,behavior:'instant'});if(p==='chat'){let box=document.getElementById('message-scroll');if(box)box.scrollTop=box.scrollHeight}}
  function go(p){if(!s.registered&&!['splash','login','otp'].includes(p))p='login';s.page=p;render()}
  function loginSubmit(){let phone=document.getElementById('phone').value.replace(/\D/g,'');if(phone.length<9){document.getElementById('login-error').textContent='Enter a demo phone number with at least 9 digits.';return}s.otpStep=true;go('otp');toast('Demo OTP: 123456')}
  function profileSubmit(){let name=document.getElementById('pf-name').value.trim(),age=Number(document.getElementById('pf-age').value),city=document.getElementById('pf-city').value,gender=document.getElementById('pf-gender').value,bio=document.getElementById('pf-bio').value.trim(),interests=document.getElementById('pf-interests').value.trim();if(!name||!Number.isInteger(age)||age<18||age>100||!city||!gender){document.getElementById('profile-error').textContent='Enter a name, age 18–100, location and gender.';return}s.profile={name,age,city,gender,bio,interests};toast('Demo profile saved for this session.');go('verification')}
  function reset(){if(!confirm('Reset this demo session? Credits, messages and profile edits will be cleared.'))return;location.reload()}
  document.addEventListener('click',e=>{
    let el=e.target.closest('button');if(!el)return;
    if(el.dataset.profile){s.selected=Number(el.dataset.profile);go('profile');return}
    if(el.dataset.chatPerson){s.selected=Number(el.dataset.chatPerson);go('chat');return}
    if(el.dataset.adminProfile){s.selected=Number(el.dataset.adminProfile);go('profile');return}
    if(el.dataset.plan){s.selectedPlan=el.dataset.plan;go('payment');return}
    if(el.dataset.go){if(el.dataset.go==='unlock'&&s.unlocked.has(s.selected)){go('chat');return}go(el.dataset.go);return}
    if(el.id==='verify-demo'){s.verified=true;toast('Verification approved in demo only.');render(false);return}
    if(el.id==='simulate-payment'){let p=plans.find(x=>x.id===s.selectedPlan);s.balance+=p.qty;s.transactions.unshift({label:'Demo credit pack · '+p.name,detail:'TZS '+fmt(p.price)+' · '+s.selectedPayment,delta:p.qty});toast('Simulation complete! '+p.qty+' demo credit(s) added.');go('mycredits');return}
    if(el.id==='confirm-unlock'){if(s.balance<1){go('credits');return}s.balance-=1;s.unlocked.add(s.selected);s.transactions.unshift({label:'Conversation unlocked',detail:current().name,delta:-1});toast('Demo conversation unlocked!');go('chat');return}
    if(el.id==='clear-filters'){s.search=s.city=s.gender=s.age='';render(false);return}
    if(el.id==='toggle-notifications'){s.notification=!s.notification;render(false);return}
    if(el.id==='toggle-activity'){s.activity=!s.activity;render(false);return}
    if(el.id==='block-person'){let p=current();if(s.blocked.has(p.id)){s.blocked.delete(p.id);toast('Demo profile unblocked.')}else{s.blocked.add(p.id);toast('Demo profile blocked and hidden from Discover.')}render(false);return}
    if(el.id==='logout-demo'){s.registered=false;s.otpStep=false;go('login');toast('Demo logout complete. No real account session exists.');return}
    if(el.id==='reset-demo'){reset();return}
  });
  document.addEventListener('change',e=>{if(e.target.name==='payment-method')s.selectedPayment=e.target.value;if(e.target.id==='search-city'){s.city=e.target.value;render(false)}if(e.target.id==='search-gender'){s.gender=e.target.value;render(false)}if(e.target.id==='search-age'){s.age=e.target.value;render(false)}});
  let searchTimer;document.addEventListener('input',e=>{if(e.target.id==='search-text'){let value=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{s.search=value;render(false);let input=document.getElementById('search-text');if(input){input.focus();input.setSelectionRange(value.length,value.length)}},200)}});
  document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form')return loginSubmit();if(e.target.id==='otp-form'){if(document.getElementById('otp-code').value.trim()!=='123456'){document.getElementById('otp-error').textContent='Demo code is 123456.';return}s.registered=true;toast('Demo phone step complete.');go(s.profile.name?'home':'create');return}if(e.target.id==='profile-form')return profileSubmit();if(e.target.id==='chat-form'){let input=document.getElementById('chat-input'),text=input.value.trim();if(!text)return;if(!s.messages[s.selected])s.messages[s.selected]=[];s.messages[s.selected].push(text);render(false);let newInput=document.getElementById('chat-input');if(newInput)newInput.focus();return}if(e.target.id==='report-form'){let reason=document.getElementById('report-reason').value;if(!reason)return;s.reportCount=(s.reportCount||0)+1;toast('Demo report recorded for this session only. No moderator receives it.');go('profile');return}});
  render();
})();
</script>
</body>
</html>
